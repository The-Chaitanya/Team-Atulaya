<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CodeLeaf Learning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-art" aria-label="Learning portal preview">
      <a class="brand login-brand" href="index.html">
        <span class="brand-mark">CL</span>
        <span class="brand-text">CodeLeaf</span>
      </a>

      <div class="portal-orbit" aria-hidden="true">
        <div class="portal-ring"></div>
        <div class="portal-card card-one">HTML</div>
        <div class="portal-card card-two">CSS</div>
        <div class="portal-card card-three">JS</div>
      </div>

      <div class="login-copy">
        <p class="eyebrow">Unleash your adaptive learning super power</p>
        <h1>Enter the multiverse portal.</h1>
      </div>
    </section>

    <section class="login-panel" aria-labelledby="login-heading">
      <p class="eyebrow">Multiverse portal</p>
      <h1 id="login-heading">Sign in</h1>

      <form class="login-form">
        <label>
          <span>Name</span>
          <input type="text" placeholder="Your name">
        </label>

        <label>
          <span>Password</span>
          <input type="password" placeholder="Password">
        </label>

        <button type="submit">Sign in</button>
      </form>

      <div class="provider-row">
        <button class="provider-button" type="button">Google</button>
        <button class="provider-button" type="button">GitHub</button>
      </div>

      <p class="login-note">New here? <a href="course.html">Explore courses</a></p>
    </section>
  </main>
</body>
</html>
